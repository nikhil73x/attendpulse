services:
  - type: web
    name: attendpulse-api
    runtime: node
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: attendpulse-db
          property: connectionString
      - key: FRONTEND_URL
        value: "*"

databases:
  - name: attendpulse-db
    plan: free
    databaseName: attendpulse
    user: attendpulse
